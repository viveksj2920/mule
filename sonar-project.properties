# SonarQube project mapping for readiness scoring and CI quality checks
sonar.projectKey=com.optum.mrcrm-mulesoft:uhc-gpd-exp-api
sonar.projectName=mrcrm-mulesoft-gpd-exp-api

# MuleSoft project layout
sonar.sources=src/main
sonar.tests=src/test
sonar.sourceEncoding=UTF-8

# Coverage report paths (committed path — CI output should also write here)
sonar.coverage.jacoco.xmlReportPaths=coverage/jacoco/jacoco.xml
sonar.python.coverage.reportPaths=coverage.xml
